name: CI

on:
  push:
    branches: [ main, develop, 001-description-esta-secci ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff mypy

      - name: Lint (ruff)
        run: |
          python -m ruff check backend frontend tests

      - name: Static Types (mypy minimal)
        run: |
          mypy backend/src/services --ignore-missing-imports --no-strict-optional || true

      - name: Run tests (offline deterministic)
        env:
          USE_ADAPTERS: 'true'
          USE_NETWORK: 'false'
        run: |
          pytest -q

  security-scan:
    needs: build-test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Run security scan (optional)
        run: |
          python scripts/security_scan.py || true

  sbom:
    needs: build-test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install cyclonedx tool
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
      - name: Generate SBOM
        run: |
          python scripts/generate_sbom.py --format json --output sbom.json || true
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
