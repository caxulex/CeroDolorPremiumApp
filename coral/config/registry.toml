## Coral Server Agent Registry (aligned with full-registry.toml)

## We’ll define agents inline with their metadata and docker runtime hints.

[[inline-agent]]
[inline-agent.agent]
name = "Agente Investigador (AI)"
version = "0.0.1"
[inline-agent.runtimes.docker]
image = "caxulex/agent-investigador:latest"
command = ["/app/start.sh"]
env = { MISTRAL_API_KEY = "", CORAL_SERVER_URL = "" }

